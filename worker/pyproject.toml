[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ipodekho-worker"
version = "0.1.0"
description = "Background worker and administrative HTTP surface for IPO Dekho"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "tenacity>=9.1,<10",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ipo-prices = "app.prices.cli:main"
ipo-verify = "app.verification.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
